<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أنس مطور الأكواد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500&family=Readex+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121832; --surface:#1b2348; --line:#2e386b;
    --text:#eef0fa; --muted:#a7aed0; --blue:#7c9cff;
    --accent:#ffc857; --on-accent:#14161f;
    color-scheme:dark;
  }
  [data-theme="light"]{
    --bg:#f3f5ff; --surface:#ffffff; --line:#d3d9f0;
    --text:#151a38; --muted:#555c85; --blue:#3b5bdb;
    --on-accent:#ffffff;
    color-scheme:light;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;scroll-padding-top:80px}
  body{
    background:var(--bg);color:var(--text);
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    line-height:1.8;font-size:17px;
    transition:background .3s,color .3s;
  }
  h1,h2,h3,.brand{font-family:"Readex Pro","IBM Plex Sans Arabic",sans-serif;font-weight:600;line-height:1.3}
  a{color:inherit}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
  .wrap{max-width:1040px;margin-inline:auto;padding-inline:22px}

  /* scroll progress */
  #progress{position:fixed;top:0;inset-inline:0;height:3px;z-index:30;
    background:var(--accent);transform-origin:left center;transform:scaleX(0)}
  [dir="rtl"] #progress{transform-origin:right center}

  /* header */
  header{position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
  .brand{font-size:19px;text-decoration:none;white-space:nowrap}
  nav{display:flex;gap:22px}
  nav a{text-decoration:none;color:var(--muted);font-size:16px;transition:color .2s}
  nav a:hover{color:var(--text)}
  .tools{display:flex;align-items:center;gap:10px}
  .dots{display:flex;gap:7px}
  .dot{width:20px;height:20px;border-radius:50%;border:2px solid transparent;
    background:var(--c);padding:0;transition:transform .15s}
  .dot:hover{transform:scale(1.15)}
  .dot[aria-pressed="true"]{border-color:var(--text)}
  .pill{background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:5px 15px;font-size:15px;transition:border-color .2s}
  .pill:hover{border-color:var(--accent)}

  /* hero */
  .hero-box{position:relative;overflow:hidden}
  #net{position:absolute;inset:0;width:100%;height:100%;opacity:.55;pointer-events:none}
  .hero{position:relative;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;
    align-items:center;padding-block:88px 76px}
  .hero h1{font-size:clamp(34px,5.4vw,58px);margin-bottom:20px}
  .hero p{color:var(--muted);max-width:46ch;margin-bottom:32px}
  .actions{display:flex;flex-wrap:wrap;gap:14px}
  .btn{display:inline-block;text-decoration:none;padding:12px 26px;border-radius:10px;
    font-weight:500;border:1px solid var(--line);background:transparent;
    transition:transform .15s,border-color .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .btn.ghost:hover{border-color:var(--blue)}

  .code{direction:ltr;text-align:left;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
  .code-top{display:flex;gap:7px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .code-top i{width:11px;height:11px;border-radius:50%;background:var(--line)}
  .code pre{padding:22px 20px;min-height:230px;font:15px/1.8 ui-monospace,Menlo,Consolas,monospace;
    color:var(--blue);white-space:pre-wrap}
  .cursor{display:inline-block;width:8px;height:18px;background:var(--accent);
    vertical-align:-3px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}

  /* motion */
  .brand{display:inline-flex;align-items:center;gap:10px}
  .logo{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:9px;
    background:var(--accent);color:var(--on-accent);direction:ltr;
    font:600 13px ui-monospace,Menlo,monospace;transition:transform .25s}
  .brand:hover .logo{transform:rotate(-10deg) scale(1.08)}
  .hero h1{background:linear-gradient(100deg,var(--text),var(--accent),var(--blue),var(--text));
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
    color:transparent;animation:shine 9s linear infinite}
  @keyframes shine{to{background-position:300% 0}}
  .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.28;background:var(--accent);
    animation:float 14s ease-in-out infinite;pointer-events:none}
  .o1{width:260px;height:260px;top:-60px;inset-inline-start:-40px}
  .o2{width:220px;height:220px;bottom:-70px;inset-inline-end:10%;background:var(--blue);animation-delay:-6s}
  @keyframes float{50%{transform:translate(30px,26px) scale(1.12)}}
  .code{transition:transform .2s}
  .btn.main{position:relative;overflow:hidden}
  .btn.main::after{content:"";position:absolute;inset:0;transform:translateX(-120%);
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%)}
  .btn.main:hover::after{transition:transform .6s;transform:translateX(120%)}
  .marquee{overflow:hidden;border-block:1px solid var(--line);direction:ltr;padding-block:14px}
  .track{display:flex;width:max-content;animation:slide 30s linear infinite}
  .track span{font:600 22px "Readex Pro",sans-serif;color:var(--muted);padding-inline:28px;white-space:nowrap}
  .track span:nth-child(even){color:var(--accent)}
  @keyframes slide{to{transform:translateX(-50%)}}
  .js .rv{opacity:0;transform:translateY(24px);transition:opacity .6s,transform .6s}
  .js .rv.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    .hero h1,.orb,.track{animation:none}
    .js .rv{opacity:1;transform:none}
  }

  .composer{max-width:560px;display:grid;gap:12px}
  .composer label{font-size:15px;color:var(--muted)}
  .composer input,.composer textarea{width:100%;background:var(--surface);color:var(--text);
    border:1px solid var(--line);border-radius:10px;padding:11px 14px;font:inherit;
    transition:border-color .2s}
  .composer textarea{resize:vertical;min-height:110px}
  .composer input:focus,.composer textarea:focus{outline:none;border-color:var(--accent)}
  .composer .hint{color:var(--muted);font-size:15px}
  .handle{direction:ltr;unicode-bidi:isolate;color:var(--muted);font:15px ui-monospace,Menlo,monospace}

  /* sections */
  section{padding-block:64px;border-top:1px solid var(--line)}
  h2{font-size:clamp(26px,3.6vw,36px);margin-bottom:12px}
  .lead{color:var(--muted);margin-bottom:30px;max-width:56ch}

  /* skills playground */
  .tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .tab{background:transparent;border:1px solid var(--line);border-radius:10px;
    padding:8px 22px;font-family:"Readex Pro",sans-serif;font-weight:600;transition:all .2s}
  .tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .panel{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;
    background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
  .panel[hidden]{display:none}
  .panel p{color:var(--muted)}
  .stage{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .mock{width:190px;display:grid;gap:6px;direction:ltr}
  .mock div{border:1px dashed var(--blue);border-radius:6px;padding:6px 10px;
    font:13px ui-monospace,Menlo,monospace;color:var(--blue)}
  .mock div:nth-child(2){padding-block:22px}
  .box{width:110px;height:110px;background:var(--accent);transition:border-radius .1s,background .1s}
  input[type=range]{width:200px;accent-color:var(--accent)}
  .count{font:600 44px "Readex Pro",sans-serif;color:var(--accent)}

  /* work */
  .chips{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
  .chip,.qchip{background:transparent;border:1px solid var(--line);border-radius:999px;
    padding:5px 18px;font-size:15px;transition:all .2s}
  .chip[aria-pressed="true"],.qchip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  #list{border-top:1px solid var(--line)}
  .row{display:grid;grid-template-columns:1.2fr 2fr auto;gap:24px;align-items:baseline;
    width:100%;text-align:start;background:transparent;border:0;
    border-bottom:1px solid var(--line);padding:22px 8px;transition:background .2s}
  .row:hover{background:var(--surface)}
  .row h3{font-size:20px}
  .row p{color:var(--muted)}
  .row small{color:var(--blue);font-size:14px;direction:ltr}

  dialog{margin:auto;max-width:480px;width:calc(100% - 40px);background:var(--surface);
    color:var(--text);border:1px solid var(--line);border-radius:16px;padding:30px}
  dialog::backdrop{background:rgba(5,8,22,.65)}
  dialog h3{font-size:24px;margin-bottom:10px}
  dialog p{color:var(--muted);margin-bottom:12px}
  dialog small{display:block;color:var(--blue);margin-bottom:22px;direction:ltr;text-align:start}

  /* contact */
  .handle-box{display:inline-flex;align-items:center;gap:14px;background:var(--surface);
    border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 20px;margin-top:6px}
  [dir="rtl"] .handle-box{padding:8px 20px 8px 8px}
  .handle-box code{direction:ltr;font:16px ui-monospace,Menlo,monospace}
  .handle-box .btn{padding:8px 20px}

  #toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px);opacity:0;
    background:var(--text);color:var(--bg);padding:10px 22px;border-radius:999px;
    font-size:15px;pointer-events:none;transition:all .3s;z-index:40}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  footer{border-top:1px solid var(--line);padding-block:26px;color:var(--muted);font-size:14px}

  @media (max-width:820px){
    nav{display:none}
    .hero,.panel{grid-template-columns:1fr}
    .hero{padding-block:52px 48px}
    .row{grid-template-columns:1fr;gap:6px}
  }
  @media (max-width:430px){.brand{font-size:16px}.pill{padding:4px 11px}}
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .cursor{animation:none}
    *{transition:none!important}
  }
</style>
<script>document.documentElement.classList.add("js")</script>
</head>
<body>
<div id="progress"></div>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top"><span class="logo">&lt;/&gt;</span><span data-i="brand">أنس مطور الأكواد</span></a>
    <nav>
      <a href="#skills" data-i="navSkills">مهاراتي</a>
      <a href="#work" data-i="navWork">شغلي</a>
      <a href="#contact" data-i="navContact">تواصل</a>
    </nav>
    <div class="tools">
      <div class="dots" id="dots" role="group" aria-label="Accent color"></div>
      <button class="pill" id="themeBtn" type="button"></button>
      <button class="pill" id="langBtn" type="button"></button>
    </div>
  </div>
</header>

<main id="top">
  <div class="hero-box">
    <canvas id="net" aria-hidden="true"></canvas>
    <i class="orb o1"></i><i class="orb o2"></i>
    <div class="wrap hero">
      <div>
        <h1 data-i="heroTitle"></h1>
        <p data-i="heroText"></p>
        <div class="actions">
          <a class="btn main" href="#contact" data-i="ctaTalk"></a>
          <a class="btn ghost" href="#work" data-i="ctaWork"></a>
        </div>
      </div>
      <div class="code" aria-hidden="true">
        <div class="code-top"><i></i><i></i><i></i></div>
        <pre><span id="typed"></span><span class="cursor"></span></pre>
      </div>
    </div>
  </div>

  <div class="marquee" aria-hidden="true"><div class="track" id="track"><span>HTML</span><span>CSS</span><span>JavaScript</span><span>{ }</span><span>&lt;/&gt;</span><span>HTML</span><span>CSS</span><span>JavaScript</span><span>{ }</span><span>&lt;/&gt;</span></div></div>

  <section id="skills">
    <div class="wrap">
      <h2 data-i="skillsTitle"></h2>
      <p class="lead" data-i="skillsLead"></p>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" data-tab="html" aria-selected="true">HTML</button>
        <button class="tab" role="tab" data-tab="css" aria-selected="false">CSS</button>
        <button class="tab" role="tab" data-tab="js" aria-selected="false">JavaScript</button>
      </div>

      <div class="panel" data-panel="html">
        <p data-i="pHtml"></p>
        <div class="stage"><div class="mock"><div>&lt;header&gt;</div><div>&lt;main&gt;</div><div>&lt;footer&gt;</div></div></div>
      </div>
      <div class="panel" data-panel="css" hidden>
        <p data-i="pCss"></p>
        <div class="stage">
          <div class="box" id="box"></div>
          <input type="range" id="radius" min="0" max="55" value="12" aria-label="radius">
        </div>
      </div>
      <div class="panel" data-panel="js" hidden>
        <p data-i="pJs"></p>
        <div class="stage">
          <div class="count" id="count">0</div>
          <button class="btn main" id="plus" type="button" data-i="pJsBtn"></button>
        </div>
      </div>
    </div>
  </section>

  <section id="work">
    <div class="wrap">
      <h2 data-i="workTitle"></h2>
      <p class="lead" data-i="workLead"></p>
      <div class="chips" id="chips">
        <button class="chip" data-f="all" aria-pressed="true" data-i="fAll"></button>
        <button class="chip" data-f="static" aria-pressed="false" data-i="fStatic"></button>
        <button class="chip" data-f="js" aria-pressed="false" data-i="fJs"></button>
      </div>
      <div id="list"></div>
    </div>
  </section>

  <section id="contact">
    <div class="wrap">
      <h2 data-i="contactTitle"></h2>
      <p class="lead" data-i="contactText"></p>
      <div class="composer">
        <div class="chips" id="quick">
          <button class="qchip" type="button" data-q="q1" aria-pressed="true" data-i="c1"></button>
          <button class="qchip" type="button" data-q="q2" aria-pressed="false" data-i="c2"></button>
          <button class="qchip" type="button" data-q="q3" aria-pressed="false" data-i="c3"></button>
        </div>
        <label for="nm" data-i="lblName"></label>
        <input id="nm" type="text" autocomplete="name" maxlength="60">
        <label for="msg" data-i="lblMsg"></label>
        <textarea id="msg" rows="4"></textarea>
        <p class="hint" data-i="contactHint"></p>
        <div class="actions">
          <button class="btn main" id="sendBtn" type="button" data-i="send"></button>
          <button class="btn ghost" id="copyBtn" type="button" data-i="copy"></button>
        </div>
        <div class="handle">@kira_el_mo2zy</div>
      </div>
    </div>
  </section>
</main>

<footer><div class="wrap" data-i="footer"></div></footer>

<dialog id="dlg">
  <h3 id="dT"></h3><p id="dD"></p><small id="dS"></small>
  <button class="btn main" id="dClose" type="button" data-i="close"></button>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const T = {
  ar:{
    title:"أنس مطور الأكواد", brand:"أنس مطور الأكواد",
    navSkills:"مهاراتي", navWork:"شغلي", navContact:"تواصل",
    heroTitle:"بحوّل أفكارك من الخيال للمواقع.",
    heroText:"قول فكرتك وأنا أعملها لك.",
    ctaTalk:"كلمني", ctaWork:"شوف شغلي",
    skillsTitle:"بشتغل بإيه", skillsLead:"دوس على أي تبويب وجرّب بنفسك.",

    fAll:"الكل", fStatic:"HTML و CSS", fJs:"JavaScript",

    contactHint:"لما تدوس ابعت، واتساب بيفتح والرسالة مكتوبة جاهزة ليا. اختار اللي يناسبك أو اكتب بإيدك، وبعدها دوس إرسال.",
    c1:"عايز أبدأ شغل", c2:"عايز مشروع", c3:"عندي فكرة",
    q1:"السلام عليكم، عايز أبدأ شغل معاك.",
    q2:"السلام عليكم، عايز أعمل مشروع موقع.",
    q3:"السلام عليكم، عندي فكرة وعايز أحكيلك عليها.",
    lblName:"اسمك", lblMsg:"رسالتك", phName:"اسمك (اختياري)",
    nameLine:"اسمي: ", send:"ابعت على واتساب", sending:"بفتح واتساب والرسالة جاهزة",
    copy:"انسخ اليوزر", copied:"اتنسخ اليوزر",
    close:"قفل", footer:"© أنس. اتعمل بإيدي.",
    themeDark:"داكن", themeLight:"فاتح", lang:"English"
  },
  en:{
    title:"Anas | Code Dev", brand:"Anas | Code Dev",
    navSkills:"Skills", navWork:"Work", navContact:"Contact",
    heroTitle:"I turn your ideas from imagination into websites.",
    heroText:"Tell me your idea and I’ll build it.",
    ctaTalk:"Talk to me", ctaWork:"See my work",
    skillsTitle:"What I use", skillsLead:"Click a tab and try it yourself.",
    pHtml:"HTML is the structure of the page: header, content and footer, each in its place.",
    pCss:"CSS handles the look. Move the slider and watch the corners change.",
    pJs:"JavaScript makes the site respond. Press the button.", pJsBtn:"Add one",
    workTitle:"My work", workLead:"Click any project to see the details.",
    fAll:"All", fStatic:"HTML & CSS", fJs:"JavaScript",
    contactTitle:"Want to work together?", contactText:"Tell me what you need and I’ll get back to you soon.",
    contactHint:"When you press send, WhatsApp opens with the message already written to me. Pick one below or write your own, then hit send in WhatsApp.",
    c1:"I want to start work", c2:"I need a project", c3:"I have an idea",
    q1:"Hi, I’d like to start working with you.",
    q2:"Hi, I need a website project built.",
    q3:"Hi, I have an idea and I’d like to tell you about it.",
    lblName:"Your name", lblMsg:"Your message", phName:"Your name (optional)",
    nameLine:"My name: ", send:"Send on WhatsApp", sending:"Opening WhatsApp, message ready",
    copy:"Copy username", copied:"Username copied",
    close:"Close", footer:"© Anas. Made by hand.",
    themeDark:"Dark", themeLight:"Light", lang:"العربية"
  }
};

// عدّل المشاريع دي بمشاريعك الحقيقية
const PROJECTS = [
  {kind:"static", tools:"HTML · CSS",
   ar:{t:"موقع تعريفي لشركة", d:"صفحة رئيسية وصفحة خدمات وفورم تواصل، وشغال كويس على الموبايل."},
   en:{t:"Company website", d:"Home page, services page and a contact form. Works well on phones."}},
  {kind:"js", tools:"HTML · CSS · JS",
   ar:{t:"متجر صغير", d:"عرض المنتجات وسلة مشتريات بسيطة بالـ JavaScript."},
   en:{t:"Small online shop", d:"Product listing and a simple cart written in JavaScript."}},
  {kind:"static", tools:"HTML · CSS",
   ar:{t:"صفحة شخصية", d:"صفحة بسيطة فيها نبذة وروابط وطرق التواصل."},
   en:{t:"Personal page", d:"A simple page with a short bio, links and ways to reach me."}},
  {kind:"js", tools:"HTML · CSS · JS",
   ar:{t:"لعبة بسيطة", d:"لعبة بتشتغل في المتصفح، بتتحكم فيها بالكيبورد أو باللمس."},
   en:{t:"Simple game", d:"A game that runs in the browser, played with keyboard or touch."}}
];

const ACCENTS = [
  {d:"#ffc857", l:"#b7791f"}, {d:"#5eead4", l:"#0f766e"},
  {d:"#ff7eb6", l:"#c2255c"}, {d:"#7c9cff", l:"#3b5bdb"}
];

const root = document.documentElement;
const $ = s => document.querySelector(s);
const state = {lang:"ar", theme:"dark", accent:0, filter:"all"};
const store = {
  get(k,def){ try{ return localStorage.getItem(k) ?? def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};

/* ---------- apply settings ---------- */
function applyAccent(){
  const a = ACCENTS[state.accent];
  root.style.setProperty("--accent", state.theme === "dark" ? a.d : a.l);
  document.querySelectorAll(".dot").forEach((b,i)=>b.setAttribute("aria-pressed", i===state.accent));
}
function applyTheme(){
  root.dataset.theme = state.theme;
  $("#themeBtn").textContent = state.theme === "dark" ? T[state.lang].themeDark : T[state.lang].themeLight;
  applyAccent();
}
function applyLang(){
  const t = T[state.lang];
  root.lang = state.lang;
  root.dir = state.lang === "ar" ? "rtl" : "ltr";
  document.title = t.title;
  document.querySelectorAll("[data-i]").forEach(el => el.textContent = t[el.dataset.i]);
  $("#langBtn").textContent = t.lang;
  $("#nm").placeholder = t.phName;
  setMsg();
  applyTheme();
  renderList();
}

/* ---------- controls ---------- */
const dots = $("#dots");
ACCENTS.forEach((a,i)=>{
  const b = document.createElement("button");
  b.className = "dot"; b.type = "button";
  b.style.setProperty("--c", a.d);
  b.setAttribute("aria-label","accent "+(i+1));
  b.addEventListener("click",()=>{ state.accent=i; store.set("accent",i); applyAccent(); });
  dots.appendChild(b);
});
$("#themeBtn").addEventListener("click",()=>{
  state.theme = state.theme==="dark" ? "light" : "dark";
  store.set("theme",state.theme); applyTheme();
});
$("#langBtn").addEventListener("click",()=>{
  state.lang = state.lang==="ar" ? "en" : "ar";
  store.set("lang",state.lang); applyLang();
});

/* ---------- skills playground ---------- */
$("#tabs").addEventListener("click",e=>{
  const b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t===b));
  document.querySelectorAll(".panel").forEach(p=>p.hidden = p.dataset.panel !== b.dataset.tab);
});
$("#radius").addEventListener("input",e=>{
  const v = +e.target.value;
  $("#box").style.borderRadius = v+"%";
});
let n = 0;
$("#plus").addEventListener("click",()=>{ $("#count").textContent = ++n; });

/* ---------- work list + dialog ---------- */
function renderList(){
  const list = $("#list"); list.textContent = "";
  PROJECTS.filter(p=>state.filter==="all"||p.kind===state.filter).forEach(p=>{
    const row = document.createElement("button");
    row.className = "row"; row.type = "button";
    const c = p[state.lang];
    row.innerHTML = "<h3></h3><p></p><small></small>";
    row.children[0].textContent = c.t;
    row.children[1].textContent = c.d;
    row.children[2].textContent = p.tools;
    row.addEventListener("click",()=>{
      $("#dT").textContent = c.t; $("#dD").textContent = c.d; $("#dS").textContent = p.tools;
      $("#dlg").showModal();
    });
    list.appendChild(row);
  });
}
$("#chips").addEventListener("click",e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  state.filter = b.dataset.f;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed", c===b));
  renderList();
});
$("#dClose").addEventListener("click",()=>$("#dlg").close());
$("#dlg").addEventListener("click",e=>{ if(e.target===e.currentTarget) e.currentTarget.close(); });

/* ---------- copy username ---------- */
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.id); toast.id = setTimeout(()=>t.classList.remove("show"),1800);
}
$("#copyBtn").addEventListener("click",()=>{
  try{ navigator.clipboard.writeText("@kira_el_mo2zy"); }catch(e){}
  toast(T[state.lang].copied);
});

/* ---------- message composer ---------- */
let edited = false, quick = "q1";
function setMsg(){
  if(!edited) $("#msg").value = T[state.lang][quick];
}
$("#msg").addEventListener("input",()=>{ edited = true; });
$("#quick").addEventListener("click",e=>{
  const b = e.target.closest(".qchip"); if(!b) return;
  quick = b.dataset.q; edited = false;
  document.querySelectorAll(".qchip").forEach(c=>c.setAttribute("aria-pressed", c===b));
  setMsg();
});
$("#sendBtn").addEventListener("click",()=>{
  const t = T[state.lang];
  const name = $("#nm").value.trim();
  let text = $("#msg").value.trim() || t[quick];
  if(name) text += "\n\n" + t.nameLine + name;
  const num = ["20","100","954","2181"].join("");
  toast(t.sending);
  window.open("https://wa.me/"+num+"?text="+encodeURIComponent(text), "_blank", "noopener");
});

/* ---------- scroll progress ---------- */
const bar = $("#progress");
function onScroll(){
  const h = root.scrollHeight - innerHeight;
  bar.style.transform = "scaleX(" + (h>0 ? scrollY/h : 0) + ")";
}
addEventListener("scroll",onScroll,{passive:true}); onScroll();

/* ---------- typing effect ---------- */
const code =
`const anas = {
  builds: "websites",
  tools: ["HTML", "CSS", "JS"],
  openToWork: true
};`;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if(reduce){ $("#typed").textContent = code; }
else{
  let i = 0;
  const id = setInterval(()=>{
    $("#typed").textContent = code.slice(0,++i);
    if(i>=code.length) clearInterval(id);
  },55);
}

/* ---------- hero network background ---------- */
(function(){
  const cv = $("#net"), ctx = cv.getContext("2d");
  let w, h, pts = [];
  function size(){
    const r = cv.getBoundingClientRect();
    w = cv.width = r.width; h = cv.height = r.height;
    const count = Math.round(Math.min(70, w*h/16000));
    pts = Array.from({length:count},()=>({
      x:Math.random()*w, y:Math.random()*h,
      vx:(Math.random()-.5)*.35, vy:(Math.random()-.5)*.35
    }));
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const col = getComputedStyle(root).getPropertyValue("--accent").trim();
    ctx.fillStyle = col; ctx.strokeStyle = col;
    pts.forEach((p,i)=>{
      if(!reduce){
        p.x+=p.vx; p.y+=p.vy;
        if(p.x<0||p.x>w) p.vx*=-1;
        if(p.y<0||p.y>h) p.vy*=-1;
      }
      ctx.beginPath(); ctx.arc(p.x,p.y,1.8,0,6.283); ctx.fill();
      for(let j=i+1;j<pts.length;j++){
        const q = pts[j], d = Math.hypot(p.x-q.x,p.y-q.y);
        if(d<120){
          ctx.globalAlpha = (1-d/120)*.5;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }
    });
    if(!reduce) requestAnimationFrame(draw);
  }
  size(); draw();
  addEventListener("resize",()=>{ size(); if(reduce) draw(); });
})();

/* ---------- extra motion ---------- */
const track = $("#track"); track.innerHTML += track.innerHTML;

const hb = $(".hero-box"), cd = $(".code");
if(!reduce && matchMedia("(pointer:fine)").matches){
  hb.addEventListener("mousemove",e=>{
    const r = hb.getBoundingClientRect();
    const x = (e.clientX-r.left)/r.width-.5, y = (e.clientY-r.top)/r.height-.5;
    cd.style.transform = "perspective(900px) rotateY("+(x*10)+"deg) rotateX("+(-y*10)+"deg)";
  });
  hb.addEventListener("mouseleave",()=>{ cd.style.transform = ""; });
}

const rvEls = document.querySelectorAll("section h2, section .lead, .tabs, .panel, .chips, #list, .composer");
rvEls.forEach(el=>el.classList.add("rv"));
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target); }
}),{threshold:.15});
rvEls.forEach(el=>io.observe(el));

/* ---------- start ---------- */
state.lang   = store.get("lang","ar");
state.theme  = store.get("theme","dark");
state.accent = +store.get("accent",0) || 0;
applyLang();
</script>
